# Local development dependencies for DashCart.
# Start: docker compose up -d    Stop: docker compose down    Wipe data: docker compose down -v
services:
  mysql:
    image: mysql:8.4
    container_name: dashcart-mysql
    environment:
      MYSQL_DATABASE: dashcart
      MYSQL_USER: dashcart
      MYSQL_PASSWORD: dashcart
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    container_name: dashcart-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
