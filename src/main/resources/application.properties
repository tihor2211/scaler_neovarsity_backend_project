spring.application.name=dashcart
server.port=8080

# MySQL (docker-compose locally, RDS on AWS). Override with env vars in other environments.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dashcart}
spring.datasource.username=${DB_USERNAME:dashcart}
spring.datasource.password=${DB_PASSWORD:dashcart}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis (catalogue cache, Redis stock strategy)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT. The default secret is for local development only; set JWT_SECRET (Base64, 256+ bits) elsewhere.
dashcart.jwt.secret=${JWT_SECRET:ZGFzaGNhcnQtbG9jYWwtZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0yMDI2}
dashcart.jwt.ttl=${JWT_TTL:PT1H}

# Login is JWT-only, so Boot's default in-memory user isn't needed.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# First admin user, created on startup when both are set.
dashcart.admin.email=${ADMIN_EMAIL:}
dashcart.admin.password=${ADMIN_PASSWORD:}

# Checkout. strategy: NAIVE | OPTIMISTIC | PESSIMISTIC | CONDITIONAL_UPDATE | REDIS (switchable at runtime).
dashcart.checkout.strategy=${CHECKOUT_STRATEGY:CONDITIONAL_UPDATE}
dashcart.checkout.reservation-ttl=PT10M
dashcart.checkout.optimistic-max-attempts=5
dashcart.checkout.expiry-check-interval=PT30S
dashcart.cart.max-quantity-per-item=10

# Catalogue cache in Redis. Listings may show "in stock" up to 30 s late; checkout always re-checks stock.
spring.cache.type=${CACHE_TYPE:redis}
spring.cache.redis.time-to-live=30s
spring.cache.redis.key-prefix=cache:

# Kafka (order events). max.block.ms bounds how long a send can wait if Kafka is unreachable.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.consumer.auto-offset-reset=earliest

# Razorpay (test mode keys start with rzp_test_). Without a key id a fake gateway is used.
dashcart.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
dashcart.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
dashcart.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
dashcart.payment.razorpay.base-url=https://api.razorpay.com

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
