spring.application.name=dashcart
server.port=8080

# MySQL (docker-compose locally, RDS on AWS). Override with env vars in other environments.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dashcart}
spring.datasource.username=${DB_USERNAME:dashcart}
spring.datasource.password=${DB_PASSWORD:dashcart}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis (catalogue cache, Redis stock strategy)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
